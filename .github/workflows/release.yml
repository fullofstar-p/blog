# ============================================================================
# Release：构建前后端镜像并推送到阿里云容器镜像服务 ACR
#
# 触发：
#   push 到 dev     → 镜像 tag：dev、sha-xxxxxxx
#   push 到 master  → 镜像 tag：master、latest、sha-xxxxxxx
#   push 标签 v1.2.3 → 镜像 tag：v1.2.3、1.2.3
#   手动 Run workflow → 同上（按所选分支）
#
# 推送地址（用 ACR 的「公网域名」，GitHub 托管 runner 不在 VPC 内）：
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/backend:<tag>
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/frontend:<tag>
# 服务器拉取用同一仓库的「VPC 域名」（见 docker-compose.prod.yml 与 docs/DEPLOY.md）。
#
# 必须先配置（Settings → Secrets and variables → Actions）：
#   Variables: ACR_REGISTRY   ACR 公网域名，如 crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com
#                              企业版形如 <实例名>-registry.cn-hangzhou.cr.aliyuncs.com
#              ACR_NAMESPACE  ACR 命名空间，如 blog
#   Secrets:   ACR_USERNAME   阿里云账号登录名，或 RAM 用户 <登录名>@<账号别名>.onaliyun.com
#              ACR_PASSWORD   ACR 控制台「访问凭证」里单独设置的固定密码（不是阿里云登录密码）
# 未配置时 prepare 阶段会直接失败并提示缺哪一项（故意 fail-fast，避免静默不发布）。
#
# 可选自动部署：Variables 里把 ENABLE_AUTO_DEPLOY 设为 true，并配置
# SSH_HOST / SSH_USER / SSH_PRIVATE_KEY（可选 SSH_PORT）后，master 分支镜像推送成功
# 会通过 SSH 在服务器上执行 deploy/deploy.sh。详细步骤见 docs/DEPLOY.md。
# ============================================================================
name: Release · ACR 镜像

on:
  push:
    branches: [dev, master]
    tags: ['v*.*.*']
  workflow_dispatch:

# 同一分支/标签的发布串行执行，避免并发构建互相覆盖 latest
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 推 ACR 用的是独立的 Registry 密码，不经过 GITHUB_TOKEN，所以只读仓库内容即可
permissions:
  contents: read

jobs:
  # 先读出 ACR 配置、算好 namespace 与本次提交的 sha tag，供矩阵构建和部署复用
  prepare:
    name: 读取 ACR 配置
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registry: ${{ steps.cfg.outputs.registry }}
      namespace: ${{ steps.cfg.outputs.namespace }}
      tag: ${{ steps.cfg.outputs.tag }}
    steps:
      - name: 校验 Variables 并生成镜像路径
        id: cfg
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
        run: |
          set -euo pipefail

          # 容错：允许把 https://、首尾空格、末尾斜杠一起粘进来
          registry="${ACR_REGISTRY:-}"
          registry="${registry//[[:space:]]/}"
          registry="${registry#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"

          namespace="${ACR_NAMESPACE:-}"
          namespace="${namespace//[[:space:]]/}"
          namespace="${namespace#/}"
          namespace="${namespace%/}"
          # Docker 镜像路径必须全小写；大写的命名空间会 push 失败
          namespace="${namespace,,}"

          if [[ -z "$registry" ]]; then
            echo "::error::缺少仓库变量 ACR_REGISTRY（Settings → Secrets and variables → Actions → Variables）"
            echo "::error::填 ACR 公网域名，如 crpi-xxxx.cn-hangzhou.personal.cr.aliyuncs.com"
            exit 1
          fi
          if [[ -z "$namespace" ]]; then
            echo "::error::缺少仓库变量 ACR_NAMESPACE，如 blog"
            exit 1
          fi
          if [[ ! "$namespace" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::ACR_NAMESPACE 只能由字母、数字、点、下划线、连字符组成，不能带 /（当前：$namespace）"
            exit 1
          fi

          echo "镜像前缀：${registry}/${namespace}/{backend,frontend}"
          {
            echo "registry=$registry"
            echo "namespace=$namespace"
            echo "tag=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  images:
    name: 构建并推送 ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      IMAGE_NAMESPACE: ${{ needs.prepare.outputs.namespace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            file: ./backend/Dockerfile
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 生成镜像元数据（tag / label）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # 阿里云 ECS 基本都是 x86_64；若实例为 ARM（倚天），改成 linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 原生缓存，跨工作流复用 Maven / npm 之前的镜像层
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 可选：master 分支镜像推送成功后，SSH 到 ECS 执行发布脚本
  deploy:
    name: 部署到阿里云 ECS（可选）
    needs: [prepare, images]
    if: ${{ github.ref == 'refs/heads/master' && vars.ENABLE_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 在仓库 Settings → Environments 里给 production 配置审批人，可做发布卡点
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: 准备 SSH 私钥与 known_hosts
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 服务器同步代码并发布镜像
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; cd /opt/blog && \
             git fetch --prune origin master && \
             git reset --hard FETCH_HEAD && \
             IMAGE_TAG='$IMAGE_TAG' ./deploy/deploy.sh"
