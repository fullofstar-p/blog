# ============================================================================
# CI：提交 / PR 阶段的前后端构建校验
#
# 目的：在镜像发布之前先挡住「编译不过 / 前端 lint 不过 / 构建失败」的提交。
# 镜像构建与 GHCR 推送见 release.yml，生产部署见 docs/DEPLOY.md。
# ============================================================================
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

# 同一分支的重复触发只保留最新一次，节省 Actions 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端构建（Maven / JDK 17）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 当前仓库没有单元测试，package 等价于 compile + 打包；
      # 以后补了测试就把这里换成 mvn -B -ntp verify。
      - name: Maven 打包
        run: mvn -B -ntp package

      - name: 上传可执行 jar（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: blog-backend-jar
          path: backend/target/blog-backend.jar
          retention-days: 3
          if-no-files-found: warn

  frontend:
    name: 前端校验（ESLint + Vite 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物（便于排查）
        uses: actions/upload-artifact@v4
        with:
          name: blog-frontend-dist
          path: frontend/dist
          retention-days: 3
          if-no-files-found: warn
