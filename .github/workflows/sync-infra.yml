# ============================================================================
# Sync infra images：把生产依赖的基础镜像同步到阿里云 ACR
#
# 为什么需要：服务器在国内，docker compose up 时要拉 mysql / redis / rustfs，
# Docker Hub 直连不稳、第三方加速器（如 docker.xuanyuan.me）会限流报
# 「免费节点当前繁忙，请稍后重试」，导致部署随机失败。同步到 ACR 后，
# 服务器只从 ACR 的 VPC 域名拉镜像，部署不再依赖 Docker Hub。
#
# 触发：手动 Run workflow（改动基础镜像版本时也在这里改，然后重跑）
# 配置：和 release.yml 共用 ACR_REGISTRY / ACR_NAMESPACE（Variables）+
#       ACR_USERNAME / ACR_PASSWORD（Secrets）
#
# 同步目标（和 docker-compose.prod.yml 里的镜像地址保持一致）：
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/mysql:8.0
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/redis:7-alpine
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/rustfs:latest
#   <ACR_REGISTRY>/<ACR_NAMESPACE>/alpine:3.20   （备份/恢复命令里用）
# ============================================================================
name: Sync infra images to ACR

on:
  workflow_dispatch:

concurrency:
  group: sync-infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: 同步 ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mysql
            source: mysql:8.0
            tag: "8.0"
          - service: redis
            source: redis:7-alpine
            tag: "7-alpine"
          - service: objectstore
            source: rustfs/rustfs:latest
            tag: "latest"
          - service: alpine
            source: alpine:3.20
            tag: "3.20"
    steps:
      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 拉取并转推 ${{ matrix.service }}
        env:
          REGISTRY: ${{ vars.ACR_REGISTRY }}
          NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          SOURCE: ${{ matrix.source }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          target="${REGISTRY}/${NAMESPACE}/${{ matrix.service }}:${TAG}"
          echo "同步 ${SOURCE} → ${target}"
          docker pull "${SOURCE}"
          docker tag "${SOURCE}" "${target}"
          docker push "${target}"
          echo "完成：${target}"
