# ============================================================================
# 技术分享博客 · 前端 Nginx 配置
# 1) 托管 Vite 构建产物，history 路由回退到 index.html
# 2) /api 反向代理到 docker network 内的 backend:8080
# 3) gzip 压缩、上传大小限制 10m、静态资源缓存
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 后端 API（^~ 前缀匹配优先于下方静态资源正则，避免 /api/files/xxx.png 之类的路径被当成静态文件）
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 带哈希的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
